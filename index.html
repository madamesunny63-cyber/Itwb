<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaden Ninja Run</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- MENU -->
  <div id="menu">
    <h1>JADEN NINJA RUN</h1>
    <p>Choisis ton ninja</p>

    <div class="skins">
      <button class="skin selected" data-skin="0">
        <img src="images/skin1.png" alt="Skin 1">
        <span>Ninja</span>
      </button>

      <button class="skin" data-skin="1">
        <img src="images/skin2.png" alt="Skin 2">
        <span>Shadow</span>
      </button>

      <button class="skin" data-skin="2">
        <img src="images/skin3.png" alt="Skin 3">
        <span>Flamme</span>
      </button>
    </div>

    <button id="start">JOUER</button>
  </div>


  <!-- JEU -->
  <div id="game">

    <div id="hud">
      <span>⭐ <b id="score">0</b></span>
      <span>❤️ <b id="lives">3</b></span>
      <span>🏆 <b id="best">0</b></span>
    </div>

    <div id="gameArea">

      <div id="sky"></div>

      <div class="cloud cloud1"></div>
      <div class="cloud cloud2"></div>

      <div id="world">

        <div id="ground"></div>

        <!-- Obstacles -->
        <div class="obstacle" style="left:700px"></div>
        <div class="obstacle" style="left:1250px"></div>
        <div class="obstacle" style="left:1300px"></div>
        <div class="obstacle" style="left:2000px"></div>
        <div class="obstacle" style="left:3100px"></div>
        <div class="obstacle" style="left:4200px"></div>

        <!-- Ennemis -->
        <div class="enemy" style="left:1000px"></div>
        <div class="enemy" style="left:1800px"></div>
        <div class="enemy" style="left:2700px"></div>
        <div class="enemy" style="left:3900px"></div>
        <div class="enemy" style="left:4800px"></div>

        <!-- Plateformes -->
        <div class="platform" style="left:500px; top:180px"></div>
        <div class="platform" style="left:1500px; top:170px"></div>
        <div class="platform" style="left:2300px; top:190px"></div>
        <div class="platform" style="left:3400px; top:170px"></div>
        <div class="platform" style="left:4500px; top:190px"></div>

        <!-- Pièces -->
        <div class="coin" style="left:520px; top:140px"></div>
        <div class="coin" style="left:560px; top:110px"></div>
        <div class="coin" style="left:600px; top:140px"></div>

        <div class="coin" style="left:1500px; top:130px"></div>
        <div class="coin" style="left:1550px; top:100px"></div>
        <div class="coin" style="left:1600px; top:130px"></div>

        <div class="coin" style="left:2300px; top:150px"></div>
        <div class="coin" style="left:2350px; top:115px"></div>
        <div class="coin" style="left:2400px; top:150px"></div>

        <div class="coin" style="left:3400px; top:130px"></div>
        <div class="coin" style="left:3450px; top:95px"></div>
        <div class="coin" style="left:3500px; top:130px"></div>

        <!-- Arrivée -->
        <div id="finish"></div>

      </div>

      <!-- Jaden -->
      <div id="player">
        <img id="playerImage" src="images/skin1.png" alt="Jaden">
      </div>

      <!-- Game Over -->
      <div id="gameOver">
        <div class="gameOverBox">
          <h2 id="gameOverTitle">GAME OVER</h2>
          <p>Score : <span id="finalScore">0</span></p>
          <button id="restart">REJOUER</button>
        </div>
      </div>

    </div>

    <!-- Contrôles téléphone -->
    <div id="controls">
      <button id="left">◀</button>
      <button id="jump">SAUT</button>
      <button id="right">▶</button>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
