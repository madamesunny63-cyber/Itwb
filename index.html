<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Ninja Run</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <!-- Décor -->
        <div class="sky">
            <div class="moon"></div>
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
        </div>

        <!-- Interface -->
        <div class="top-ui">
            <div>
                SCORE
                <strong id="score">0</strong>
            </div>

            <div>
                RECORD
                <strong id="best">0</strong>
            </div>
        </div>

        <!-- Personnage -->
        <div id="ninja" class="ninja">
            🥷
        </div>

        <!-- Obstacle -->
        <div id="obstacle" class="obstacle">
            🪨
        </div>

        <!-- Sol -->
        <div class="ground"></div>

        <!-- Écran de départ -->
        <section id="startScreen" class="screen">
            <div class="panel">

                <div class="big-ninja">🥷</div>

                <h1>NINJA<br><span>RUN</span></h1>

                <p>Évite les obstacles !</p>

                <button id="startButton">
                    JOUER
                </button>

                <small>
                    Appuie sur SAUTER pour éviter les rochers
                </small>

            </div>
        </section>

        <!-- Game Over -->
        <section id="gameOver" class="screen hidden">
            <div class="panel">

                <div class="big-ninja">💥</div>

                <h2>GAME OVER</h2>

                <p>
                    Score :
                    <strong id="finalScore">0</strong>
                </p>

                <button id="restartButton">
                    REJOUER
                </button>

            </div>
        </section>

        <!-- Contrôles téléphone -->
        <div class="controls">
            <button id="jumpButton">
                SAUTER
            </button>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
