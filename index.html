<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Jaden Ninja Run</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="menu">

    <h1>JADEN</h1>
    <h2>N I N J A  R U N</h2>

    <p>Choisis ton ninja</p>

    <div class="characters">

        <button class="character selected" data-character="ninja">
            <div class="person ninja-person">
                <div class="head"></div>
                <div class="body"></div>
                <div class="legs">
                    <i></i><i></i>
                </div>
            </div>
            <strong>NINJA</strong>
        </button>

        <button class="character" data-character="shadow">
            <div class="person shadow-person">
                <div class="head"></div>
                <div class="body"></div>
                <div class="legs">
                    <i></i><i></i>
                </div>
            </div>
            <strong>SHADOW</strong>
        </button>

        <button class="character" data-character="fire">
            <div class="person fire-person">
                <div class="head"></div>
                <div class="body"></div>
                <div class="legs">
                    <i></i><i></i>
                </div>
            </div>
            <strong>FIRE</strong>
        </button>

    </div>

    <button id="playButton">JOUER</button>

</div>


<div id="game" class="hidden">

    <div class="game-top">
        <div>
            SCORE
            <b id="score">0</b>
        </div>

        <div>
            RECORD
            <b id="best">0</b>
        </div>
    </div>

    <div id="player">
        🥷
    </div>

    <div id="obstacle">
        🪨
    </div>

    <div class="ground"></div>

    <button id="jumpButton">SAUTER</button>

</div>


<div id="gameOver" class="hidden">

    <h2>GAME OVER</h2>

    <p>Score : <b id="finalScore">0</b></p>

    <button id="retryButton">REJOUER</button>

    <button id="menuButton">MENU</button>

</div>


<script src="script.js"></script>

</body>
</html>
